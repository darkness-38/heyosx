LABEL heyos_live
TEXT HELP
Boot heyOS Live.
Launches the heyOS live environment with hey-greeter and all desktop managers.
ENDTEXT
MENU LABEL heyOS Live (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID%

LABEL heyos_installer
TEXT HELP
Boot heyOS installer.
Command line environment to use hey-install.
ENDTEXT
MENU LABEL heyOS installer (%ARCH%, BIOS)
LINUX /%INSTALL_DIR%/boot/%ARCH%/vmlinuz-linux
INITRD /%INSTALL_DIR%/boot/%ARCH%/initramfs-linux.img
APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% systemd.unit=multi-user.target
